spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: postgres
#    password: anudnya

booking:
  reservation-minutes: 30        # how long an unpaid booking holds its seats (ST-09: configurable)
  max-seats-per-booking: 10
  expiry:
    enabled: true
    scan-interval-ms: 30000

clients:
  event-show:
    base-url: http://event-show-service   # service NAME resolved through Eureka
    connect-timeout-ms: 1000
    read-timeout-ms: 3000
