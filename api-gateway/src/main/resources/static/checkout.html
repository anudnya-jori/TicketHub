<!doctype html>
<html><head><meta charset="utf-8"><title>TicketHub checkout</title></head>
<body style="font-family:sans-serif">
<p id="msg">Opening Razorpay Checkout...</p>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    const q = new URLSearchParams(location.search);
    const rzp = new Razorpay({
        key: q.get('key'), order_id: q.get('order'), amount: q.get('amount'), currency: 'INR', name: 'TicketHub',
        handler: async function (r) {
            const res = await fetch('/payments/' + q.get('paymentId') + '/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-Customer-Id': q.get('customer'), 'X-Customer-Email': q.get('customer') + '@example.com'},
                body: JSON.stringify({razorpayPaymentId: r.razorpay_payment_id, razorpayOrderId: r.razorpay_order_id, razorpaySignature: r.razorpay_signature})
            });
            document.getElementById('msg').innerText = 'Verify answered ' + res.status + ': ' + await res.text();
        }
    });
    rzp.open();
</script></body></html>
